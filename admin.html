<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel THE VOID</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--fg:#f2f2f0;--dim:#8a8a87;--line:rgba(242,242,240,.14);--card:#0b0b0b;--ok:#cfe9d4;--err:#e0a19a}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:Inter,Helvetica,Arial,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px clamp(16px,4vw,48px);border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(5,5,5,.92);backdrop-filter:blur(8px);z-index:5}
header img{height:14px}
header .who{font-size:11px;letter-spacing:.16em;color:var(--dim);display:flex;gap:16px;align-items:center}
main{padding:clamp(24px,4vw,48px) clamp(16px,4vw,48px);max-width:1200px;margin:0 auto}
h1{font-weight:200;font-size:clamp(28px,4vw,48px);letter-spacing:-.01em}
.lbl{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--dim)}
.btn{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--bg);background:var(--fg);border:1px solid var(--fg);padding:12px 20px;cursor:pointer}
.btn:hover{background:transparent;color:var(--fg)}
.btn-line{font-size:10px;letter-spacing:.22em;text-transform:uppercase;background:none;border:1px solid var(--line);padding:8px 12px;cursor:pointer}
.btn-line:hover{border-color:var(--fg)}
.btn-line:disabled{opacity:.35;pointer-events:none}
input,select{background:transparent;border:0;border-bottom:1px solid var(--line);padding:9px 0;outline:none;border-radius:0}
input:focus,select:focus{border-color:var(--fg)}
select option{background:#111}
.login{max-width:380px;margin:12vh auto 0;display:grid;gap:22px}
.login label{display:grid;gap:6px}
.status{font-size:13px;color:var(--dim);min-height:1.4em}
.status.err{color:var(--err)} .status.ok{color:var(--fg)}
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--line);margin:32px 0 28px}
.tabs button{background:none;border:0;padding:0 0 14px;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--dim);cursor:pointer;border-bottom:1px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--fg);border-color:var(--fg)}
.bar{display:flex;gap:16px;align-items:end;flex-wrap:wrap;margin-bottom:24px}
.bar label{display:grid;gap:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:28px}
.stats div{background:var(--bg);padding:18px 20px}
.stats b{display:block;font-weight:200;font-size:32px;margin-top:6px}
.slot{border:1px solid var(--line);margin-bottom:12px}
.slot-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--card)}
.slot-h b{font-weight:400;font-size:15px}
.cap{display:flex;gap:5px;align-items:center;font-size:11px;letter-spacing:.14em;color:var(--dim)}
.cap i{width:8px;height:8px;border-radius:50%;border:1px solid var(--fg)}
.cap i.f{background:var(--fg)}
.slot-empty{padding:12px 18px;color:var(--dim);font-size:13px}
.row{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border-bottom:0}
.row small{display:block;color:var(--dim);font-size:12px;margin-top:3px}
.row.cancelada{opacity:.45}
.row.cancelada .n{text-decoration:line-through}
.tag{font-size:9px;letter-spacing:.24em;text-transform:uppercase;border:1px solid var(--line);padding:4px 8px;color:var(--dim)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:400;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
td small{color:var(--dim)}
.m-activa{color:var(--ok)} .m-solicitada{color:#f0d79a}
.wrap-t{overflow-x:auto}
@media (max-width:720px){.row{grid-template-columns:1fr auto}.row .c2,.row .c3{grid-column:1}}
</style>
</head>
<body>
<header>
  <a href="./"><img src="assets/logo.png" alt="THE VOID"></a>
  <div class="who"><span id="who"></span><button class="btn-line" id="salir" hidden>Salir</button></div>
</header>

<main>
  <form class="login" id="login" hidden>
    <h1>Panel del staff</h1>
    <label><span class="lbl">Correo</span><input name="email" type="email" required autocomplete="email"></label>
    <label><span class="lbl">Contraseña</span><input name="password" type="password" required autocomplete="current-password"></label>
    <button class="btn" type="submit">Ingresar</button>
    <p class="status" id="login-st"></p>
  </form>

  <section id="app" hidden>
    <h1>Panel del staff</h1>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-t="t-citas">Citas</button>
      <button role="tab" aria-selected="false" data-t="t-personas">Personas</button>
    </div>

    <div id="t-citas">
      <div class="bar">
        <label><span class="lbl">Día</span><input type="date" id="dia"></label>
        <button class="btn-line" id="hoy" type="button">Hoy</button>
        <button class="btn-line" id="prev" type="button">← Anterior</button>
        <button class="btn-line" id="next" type="button">Siguiente →</button>
        <button class="btn-line" id="csv-citas" type="button">Exportar CSV</button>
      </div>
      <div class="stats" id="stats-citas"></div>
      <div id="slots"></div>
    </div>

    <div id="t-personas" hidden>
      <div class="bar">
        <label style="flex:1;min-width:220px"><span class="lbl">Buscar</span><input id="q" placeholder="Nombre, correo o teléfono"></label>
        <label><span class="lbl">Membresía</span>
          <select id="fm"><option value="">Todas</option><option value="solicitada">Solicitadas</option><option value="activa">Activas</option><option value="vencida">Vencidas</option><option value="ninguna">Sin membresía</option></select></label>
        <button class="btn-line" id="csv-personas" type="button">Exportar CSV</button>
      </div>
      <div class="stats" id="stats-personas"></div>
      <div class="wrap-t"><table><thead><tr><th>Nombre</th><th>Correo</th><th>Teléfono</th><th>Membresía</th><th>Registro</th></tr></thead><tbody id="personas"></tbody></table></div>
    </div>
    <p class="status" id="st"></p>
  </section>
</main>

<script src="assets/vendor/supabase.js"></script>
<script src="assets/club-config.js"></script>
<script>
(() => {
  const C = window.VOID_CONFIG || {};
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const fmtHora = h => { const [H, M] = h.split(':').map(Number); return `${((H + 11) % 12) + 1}:${pad(M)} ${H < 12 ? 'a.m.' : 'p.m.'}`; };
  const MEMB = { ninguna: 'Sin membresía', solicitada: 'Solicitada', activa: 'Activa', vencida: 'Vencida' };
  const st = (el, t, m) => { el.className = 'status ' + t; el.textContent = m; };
  if (!C.supabaseUrl || !C.supabaseKey) { document.querySelector('main').innerHTML = '<p class="status">Falta configurar la conexión a la base de datos en assets/club-config.js.</p>'; return; }
  const sb = window.supabase.createClient(C.supabaseUrl, C.supabaseKey);
  const cupo = C.cupoPorHora || 3, ini = C.horario?.inicio ?? 14, fin = C.horario?.fin ?? 20;
  let personas = [], citasDia = [];

  function csv(nombre, filas) {
    const txt = filas.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + txt], { type: 'text/csv;charset=utf-8' }));
    a.download = nombre; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  /* ---------- sesión ---------- */
  async function entrar(session) {
    if (!session) { $('#app').hidden = true; $('#login').hidden = false; $('#salir').hidden = true; $('#who').textContent = ''; return; }
    const { data: admin } = await sb.rpc('es_admin');
    if (!admin) {
      $('#app').hidden = true; $('#login').hidden = false;
      st($('#login-st'), 'err', 'Esta cuenta no tiene acceso al panel. Pide al administrador que agregue tu correo a la tabla "admins".');
      await sb.auth.signOut(); return;
    }
    $('#login').hidden = true; $('#app').hidden = false; $('#salir').hidden = false;
    $('#who').textContent = session.user.email;
    if (!$('#dia').value) $('#dia').value = ymd(new Date());
    cargarCitas(); cargarPersonas();
  }
  $('#login').addEventListener('submit', async e => {
    e.preventDefault(); const d = Object.fromEntries(new FormData(e.target));
    st($('#login-st'), '', 'Ingresando…');
    const { error } = await sb.auth.signInWithPassword({ email: d.email.trim(), password: d.password });
    if (error) st($('#login-st'), 'err', error.message.includes('Invalid') ? 'Correo o contraseña incorrectos.' : error.message);
  });
  $('#salir').addEventListener('click', () => sb.auth.signOut());

  $$('.tabs [data-t]').forEach(t => t.addEventListener('click', () => {
    $$('.tabs [data-t]').forEach(x => x.setAttribute('aria-selected', String(x === t)));
    ['t-citas', 't-personas'].forEach(id => document.getElementById(id).hidden = id !== t.dataset.t);
  }));

  /* ---------- citas ---------- */
  async function cargarCitas() {
    const dia = $('#dia').value;
    const { data, error } = await sb.from('citas').select('*, perfiles(nombre,email,telefono)').eq('fecha', dia).order('hora', { ascending: true }).order('creado', { ascending: true });
    if (error) return st($('#st'), 'err', error.message);
    citasDia = data || []; pintarCitas();
  }
  function pintarCitas() {
    const act = citasDia.filter(c => c.estado === 'activa');
    const pers = act.reduce((s, c) => s + c.personas, 0);
    $('#stats-citas').innerHTML = `
      <div><span class="lbl">Citas activas</span><b>${act.length}</b></div>
      <div><span class="lbl">Personas</span><b>${pers}</b></div>
      <div><span class="lbl">Cupos libres</span><b>${(fin - ini) * cupo - pers}</b></div>
      <div><span class="lbl">Canceladas</span><b>${citasDia.length - act.length}</b></div>`;
    let html = '';
    for (let h = ini; h < fin; h++) {
      const hh = `${pad(h)}:00`;
      const lista = citasDia.filter(c => c.hora.slice(0, 5) === hh);
      const occ = lista.filter(c => c.estado === 'activa').reduce((s, c) => s + c.personas, 0);
      html += `<div class="slot"><div class="slot-h"><b>${fmtHora(hh)}</b><span class="cap">${'<i class="f"></i>'.repeat(Math.min(occ, cupo))}${'<i></i>'.repeat(Math.max(0, cupo - occ))}&nbsp; ${occ}/${cupo}</span></div>`;
      html += lista.length ? lista.map(c => `
        <div class="row ${c.estado}">
          <div><span class="n">${esc(c.perfiles?.nombre || '—')}</span><small>${esc(c.perfiles?.email || '')}${c.perfiles?.telefono ? ' · ' + esc(c.perfiles.telefono) : ''}</small></div>
          <div class="c2">${c.personas === 2 ? `2 personas<small>con ${esc(c.acompanante)}</small>` : '1 persona'}</div>
          <div class="c3">${esc(c.servicio)}<small>${esc(c.codigo)}${c.notas ? ' · ' + esc(c.notas) : ''}</small></div>
          <div>${c.estado === 'activa' ? `<button class="btn-line" data-cancel="${c.id}">Cancelar</button>` : '<span class="tag">Cancelada</span>'}</div>
        </div>`).join('') : '<div class="slot-empty">Sin reservas</div>';
      html += '</div>';
    }
    $('#slots').innerHTML = html;
  }
  $('#slots').addEventListener('click', async e => {
    const b = e.target.closest('[data-cancel]'); if (!b) return;
    if (!confirm('¿Cancelar esta cita? El cupo quedará libre.')) return;
    b.disabled = true;
    const { error } = await sb.rpc('cancelar_cita', { p_id: b.dataset.cancel });
    if (error) { b.disabled = false; return st($('#st'), 'err', error.message); }
    cargarCitas();
  });
  $('#dia').addEventListener('change', cargarCitas);
  const mover = n => { const [y, m, d] = $('#dia').value.split('-').map(Number); $('#dia').value = ymd(new Date(y, m - 1, d + n)); cargarCitas(); };
  $('#prev').addEventListener('click', () => mover(-1));
  $('#next').addEventListener('click', () => mover(1));
  $('#hoy').addEventListener('click', () => { $('#dia').value = ymd(new Date()); cargarCitas(); });
  $('#csv-citas').addEventListener('click', () => csv(`citas-${$('#dia').value}.csv`, [
    ['Fecha', 'Hora', 'Código', 'Nombre', 'Correo', 'Teléfono', 'Personas', 'Acompañante', 'Servicio', 'Notas', 'Estado'],
    ...citasDia.map(c => [c.fecha, fmtHora(c.hora), c.codigo, c.perfiles?.nombre, c.perfiles?.email, c.perfiles?.telefono, c.personas, c.acompanante, c.servicio, c.notas, c.estado])]));

  /* ---------- personas ---------- */
  async function cargarPersonas() {
    const { data, error } = await sb.from('perfiles').select('*').order('creado', { ascending: false });
    if (error) return st($('#st'), 'err', error.message);
    personas = data || []; pintarPersonas();
  }
  function filtradas() {
    const q = $('#q').value.trim().toLowerCase(), fm = $('#fm').value;
    return personas.filter(p => (!fm || p.membresia === fm) && (!q || [p.nombre, p.email, p.telefono].some(v => (v || '').toLowerCase().includes(q))));
  }
  function pintarPersonas() {
    const cnt = k => personas.filter(p => p.membresia === k).length;
    $('#stats-personas').innerHTML = `
      <div><span class="lbl">Registradas</span><b>${personas.length}</b></div>
      <div><span class="lbl">Activas</span><b>${cnt('activa')}</b></div>
      <div><span class="lbl">Solicitudes</span><b>${cnt('solicitada')}</b></div>
      <div><span class="lbl">Vencidas</span><b>${cnt('vencida')}</b></div>`;
    $('#personas').innerHTML = filtradas().map(p => `
      <tr>
        <td>${esc(p.nombre)}</td>
        <td><a href="mailto:${esc(p.email)}">${esc(p.email)}</a></td>
        <td>${p.telefono ? `<a href="https://wa.me/506${esc(p.telefono.replace(/\D/g, '').slice(-8))}" target="_blank" rel="noopener">${esc(p.telefono)}</a>` : '<small>—</small>'}</td>
        <td><select data-m="${p.id}" class="m-${p.membresia}">${Object.entries(MEMB).map(([k, v]) => `<option value="${k}" ${k === p.membresia ? 'selected' : ''}>${v}</option>`).join('')}</select></td>
        <td><small>${new Date(p.creado).toLocaleDateString('es-CR')}</small></td>
      </tr>`).join('') || '<tr><td colspan="5"><small>Sin resultados</small></td></tr>';
  }
  $('#personas').addEventListener('change', async e => {
    const s = e.target.closest('[data-m]'); if (!s) return;
    s.disabled = true;
    const { data, error } = await sb.rpc('admin_membresia', { p_user: s.dataset.m, p_estado: s.value });
    s.disabled = false;
    if (error) return st($('#st'), 'err', error.message);
    personas = personas.map(p => p.id === data.id ? data : p); pintarPersonas();
    st($('#st'), 'ok', `Membresía de ${data.nombre}: ${MEMB[data.membresia]}.`);
  });
  $('#q').addEventListener('input', pintarPersonas);
  $('#fm').addEventListener('change', pintarPersonas);
  $('#csv-personas').addEventListener('click', () => csv('personas-thevoid.csv', [
    ['Nombre', 'Correo', 'Teléfono', 'Membresía', 'Registro'],
    ...filtradas().map(p => [p.nombre, p.email, p.telefono, MEMB[p.membresia], new Date(p.creado).toLocaleDateString('es-CR')])]));

  sb.auth.onAuthStateChange((_e, s) => setTimeout(() => entrar(s), 0));
  sb.auth.getSession().then(({ data }) => entrar(data.session));
})();
</script>
</body>
</html>
